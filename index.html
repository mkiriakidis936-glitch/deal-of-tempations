    <script>
      // Guests who install from a public page must not open the admin login: use the public manifest there.
      (function () {
        var l = document.querySelector('link[rel="manifest"]');
        if (/^\/play(?:\/|$)/.test(location.pathname)) {
          if (l) l.href = '/manifest-play.webmanifest';
          document.documentElement.classList.add('app-game');
          var t = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (t) t.content = 'DT Play';
        } else if (/^\/(?:site|promo|invitation|welcome|pajama-invite|pajama-form|modes-form|gift-unlock|intake|tv|forms|vip|portal|deal)(?:\/|$)/.test(location.pathname)) {
          if (l) l.href = '/manifest-public.webmanifest';
        }
        if (/^\/(?:play|tv)(?:\/|$)|^\/$/.test(location.pathname)) document.documentElement.classList.add('app-game');
      })();
